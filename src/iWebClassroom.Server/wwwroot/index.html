<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iWebClassroom</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow" data-i18n="teacherConsole">CONSOLA DO PROFESSOR</p>
      <h1>iWebClassroom</h1>
    </div>
    <div class="header-actions">
      <label class="language-picker"><span data-i18n="language">Idioma</span><select id="language"><option value="pt-PT">Português</option><option value="en">English</option><option value="es">Español</option></select></label>
      <div class="connection"><span id="server-dot"></span><span id="server-status" data-i18n="checkingServer">A verificar servidor…</span></div>
    </div>
  </header>

  <main>
    <section class="card auth-card" id="auth-panel">
      <div>
        <h2 data-i18n="schoolAccess">Acesso à escola</h2>
        <p data-i18n="tokenHelp">Introduza o token administrativo configurado no servidor. O token fica apenas nesta sessão do navegador.</p>
      </div>
      <form id="auth-form">
        <input id="admin-token" type="password" autocomplete="current-password" placeholder="Token administrativo" data-i18n-placeholder="adminToken" required>
        <button type="submit" data-i18n="enter">Entrar</button>
      </form>
    </section>

    <div id="workspace" hidden>
      <section class="toolbar card">
        <div>
          <label for="classroom-filter" data-i18n="classroom">Sala</label>
          <select id="classroom-filter"><option value="" data-i18n="allClassrooms">Todas as salas</option></select>
        </div>
        <button id="refresh" class="secondary" data-i18n="refresh">Atualizar lista</button>
        <span id="selection-count">0 selecionados</span>
      </section>

      <section class="layout">
        <div class="card devices-card">
          <div class="section-heading">
            <div>
              <p class="eyebrow" data-i18n="devices">DISPOSITIVOS</p>
              <h2 data-i18n="computers">Computadores</h2>
            </div>
            <button id="select-all" class="text-button" data-i18n="selectVisible">Selecionar visíveis</button>
          </div>
          <div id="agents" class="agent-list"></div>
        </div>

        <aside class="card actions-card">
          <p class="eyebrow" data-i18n="actions">AÇÕES</p>
          <h2 data-i18n="classControls">Controlos da aula</h2>

          <label for="message" data-i18n="studentMessage">Mensagem aos alunos</label>
          <textarea id="message" maxlength="500" rows="3" placeholder="Escreva uma indicação breve…" data-i18n-placeholder="messagePlaceholder"></textarea>
          <button data-command="message" data-i18n="sendMessage">Enviar mensagem</button>

          <div class="divider"></div>
          <p class="group-label" data-i18n="openApplication">Abrir aplicação</p>
          <div class="button-grid">
            <button data-command="app" data-app="notepad" class="secondary" data-i18n="notepad">Bloco de Notas</button>
            <button data-command="app" data-app="calculator" class="secondary" data-i18n="calculator">Calculadora</button>
          </div>

          <div class="divider"></div>
          <p class="group-label" data-i18n="teacherScreen">Ecrã do professor</p>
          <button data-command="share" data-i18n="startMirroring">Iniciar espelhamento</button>
          <button data-command="stop-share" class="danger secondary" data-i18n="stopMirroring">Parar espelhamento</button>
        </aside>
      </section>
    </div>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
