name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore
        run: dotnet restore iWebClassroom.slnx --configfile NuGet.Config
      - name: Build
        run: dotnet build iWebClassroom.slnx --configuration Release --no-restore
      - name: Smoke test
        shell: pwsh
        run: ./scripts/smoke-test.ps1
      - name: Create Windows artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        id: release_artifacts
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $thumbprint = ''
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64)) {
            $certificatePath = Join-Path $env:RUNNER_TEMP 'iwebclassroom-signing.pfx'
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
            try {
              $securePassword = ConvertTo-SecureString $env:SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
              $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
              $thumbprint = $certificate.Thumbprint
            }
            finally {
              Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
            }
          }
          ./scripts/build-release.ps1 -Version $version -SigningCertificateThumbprint $thumbprint
      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: iWebClassroom-${{ github.ref_name }}
          path: |
            artifacts/*.zip
            artifacts/*.msi
            artifacts/*-stable.json
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' --generate-notes
          gh release upload '${{ github.ref_name }}' artifacts/*.zip artifacts/*.msi artifacts/*-stable.json
